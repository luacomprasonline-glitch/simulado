const row=(t,a,b)=>`<div>${t}: <b>${a} de ${b}</b> (${Math.round(a/b*100)}%)</div><div class="bar"><div style="width:${a/b*100}%"></div></div>`;
$.innerHTML=hd(fmt(sec))+`<div class="card"><div class="big">${String(pc).replace('.',',')}%</div><p style="margin:6px 0 14px"><b>${h} de ${n}</b> questões corretas · nota <b>${nota}</b> de 10 · tempo ${fmt(sec)}</p>${row('Língua Portuguesa',ph,pn)}${row('Matemática',mh,mn)}<p class="mut" style="margin:0">Em branco: ${A.filter(x=>x<0).length}</p></div>
<div class="warn" id="sv">${svMsg}</div><div class="row"><button class="btn p" onclick="start()">Novo simulado</button><button class="btn" onclick="onlyWrong=!onlyWrong;result(${sec})">${onlyWrong?'Mostrar todas':'Só as erradas'}</button></div><h2 style="margin:22px 0 10px">Revisão</h2>`+
Q.map((q,i)=>{const ok=A[i]==q.k;if(onlyWrong&&ok)return'';return`<div class="card rv ${ok?'ok':'no'}"><span class="tag">${i+1} · ${q.s}</span><p style="margin:0 0 8px">${q.q}</p><p class="${ok?'ok':'no'}"><b>${ok?'Acertou':A[i]<0?'Em branco':'Errou'}</b>${A[i]<0?'':` · sua resposta: ${L[A[i]]}) ${q.o[A[i]]}`}</p>${ok?'':`<p>Resposta certa: <b>${L[q.k]}) ${q.o[q.k]}</b></p>`}</div>`}).join('');
scrollTo(0,0)}
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cfg=()=>!SB_URL.includes('COLE')&&!SB_KEY.includes('COLE');
const H=()=>({apikey:SB_KEY,...(S?{Authorization:'Bearer '+S.access_token}:{})});
const chute=x=>x.r>=0&&x.ms<(x.s=='Matemática'?5000:3000);
const MT=['Números romanos','Números romanos','MMC','MDC','Frações','Frações','Números decimais e medidas','Média aritmética','Porcentagem','Múltiplos e divisores','Divisão e resto','Frações','Problemas com equações','Medidas de tempo','Geometria: área','Geometria: perímetro e área','Geometria: ângulos','Expressões numéricas','Probabilidade','Medidas de comprimento','Frações','Geometria: volume','Calendário','Sistema decimal','Frações'];
const thP=q=>/silábica|sílabas/.test(q)?'Divisão silábica':/hiato|dígrafo|consonantal|fonemas/.test(q)?'Encontros e dígrafos':/escrita corretamente|Complete a palavra/.test(q)?'Ortografia':/plural|feminino|diminutivo|aumentativo/.test(q)?'Flexões (gênero, número, grau)':/sinônimo|antônimo/.test(q)?'Sinônimos e antônimos':/alfabética/.test(q)?'Ordem alfabética':/substantivo|adjetivo|verbo|“Os”|“três”|tempo/.test(q)?'Classes de palavras e verbos':/versos|texto|receita/.test(q)?'Tipologia textual':/palavra “|acentuada/.test(q)?'Tonicidade e acentuação':'Língua Portuguesa';
function lap(){if(lastIdx>=0&&Q.length)T[lastIdx]+=Date.now()-qs;qs=Date.now()}
function mkRow(sec){const by=s=>{const i=Q.map((q,j)=>j).filter(j=>Q[j].s==s);return[i.filter(j=>A[j]==Q[j].k).length,i.length]};const[ph,pn]=by('Língua Portuguesa'),[mh,mn]=by('Matemática'),h=ph+mh,n=Q.length;
return{aluno:(PF.nome+' '+PF.sobrenome).trim(),acertos:h,total:n,pct:Math.round(h/n*1000)/10,nota:Math.round(h/n*100)/10,tempo_seg:sec,port_acertos:ph,port_total:pn,mat_acertos:mh,mat_total:mn,respostas:Q.map((q,j)=>({n:j+1,s:q.s,t:q.t,q:q.q,o:q.o,k:q.k,r:A[j],ms:T[j]}))}}
function up(){const e=document.getElementById('sv');if(e)e.innerHTML=svMsg}
const BT=(t,f)=>`<button class="btn" style="min-height:36px;padding:4px 10px;margin-left:8px" onclick="${f}">${t}</button>`;
async function save(){if(!cfg()){svMsg='⚠ Supabase não configurado: este resultado não foi salvo.';return up()}
svMsg='Salvando…';up();
try{await tok();const r=await fetch(SB_URL+'/rest/v1/tentativas',{method:'POST',headers:{...H(),'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(row)});if(!r.ok)throw new Error(r.status);svMsg='Resultado salvo ✓'+BT('Ver histórico','hist()')}
catch(e){svMsg='Não foi possível salvar ('+e.message+').'+BT('Tentar de novo','save()')}up()}
async function hist(){clearInterval(tid);$.innerHTML=hd()+'<h1 style="font-size:26px">Histórico</h1><p class="mut">Carregando…</p>';
if(!cfg()){$.innerHTML=hd()+'<h1 style="font-size:26px">Histórico</h1><div class="card">Supabase ainda não configurado. Preencha SB_URL e SB_KEY no início do arquivo.</div><button class="btn" onclick="intro()">Voltar</button>';return}
try{await tok();const r=await fetch(SB_URL+'/rest/v1/tentativas?select=*&order=criado_em.desc&limit=300',{headers:H()});if(!r.ok)throw new Error(r.status);HD=await r.json();flt=null;histView()}
catch(e){$.innerHTML=hd()+`<h1 style="font-size:26px">Histórico</h1><div class="card">Não foi possível carregar (${E(e.message)}).</div><button class="btn" onclick="intro()">Voltar</button>`}}
function histView(){DV=flt?HD.filter(d=>d.user_id==flt):HD;const D=DV,n=D.length,bk='<button class="btn" style="width:100%;margin-top:10px" onclick="intro()">Voltar ao início</button>';
if(!n){$.innerHTML=hd()+`<h1 style="font-size:26px">Histórico</h1><div class="card">Nenhuma tentativa salva ainda.</div>`+bk;return}
const sum=k=>D.reduce((s,d)=>s+(+d[k]),0),p=(a,b)=>sum(b)?Math.round(sum(a)/sum(b)*100):0,TM={};let rs=0,rf=0;
D.forEach(d=>(d.respostas||[]).forEach(x=>{const t=x.t||x.s;(TM[t]=TM[t]||[0,0])[1]++;if(x.r===x.k)TM[t][0]++;if(x.r>=0){rs++;if(chute(x))rf++}}));
const tem=Object.entries(TM).filter(([,v])=>v[1]>=2).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).slice(0,8);
const bar=(t,v)=>`<div>${t}: <b>${v}%</b></div><div class="bar"><div style="width:${v}%"></div></div>`;
$.innerHTML=hd()+`<h1 style="font-size:26px">Histórico</h1>${pro()}<div class="card"><p style="margin:0 0 10px"><b>${n}</b> tentativa${n>1?'s':''} · média de acertos <b>${p('acertos','total')}%</b></p>${bar('Língua Portuguesa',p('port_acertos','port_total'))}${bar('Matemática',p('mat_acertos','mat_total'))}<p class="mut" style="margin:0">Respostas muito rápidas (possível chute): <b>${rs?Math.round(rf/rs*100):0}%</b> das respondidas. Critério: menos de 3 s em Português e menos de 5 s em Matemática.</p></div>
<div class="card"><b>Acertos por tema (os mais fracos primeiro)</b><div style="margin-top:10px">${tem.map(([t,v])=>bar(E(t)+` (${v[0]}/${v[1]})`,Math.round(v[0]/v[1]*100))).join('')||'<span class="mut">Faça mais tentativas para ver os temas.</span>'}</div></div><h2 style="margin:18px 0 10px">Tentativas</h2>`+
D.map((d,i)=>`<details class="card"><summary><b>${new Date(d.criado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}</b> · ${E(d.aluno)} · <b>${d.pct}%</b> · nota ${String(d.nota).replace('.',',')} · ${fmt(d.tempo_seg)}</summary><p class="mut">Português ${d.port_acertos}/${d.port_total} · Matemática ${d.mat_acertos}/${d.mat_total}. Verde = acertou, vermelho = errou, cinza = em branco, ⚡ = resposta muito rápida.</p><div class="grid">${(d.respostas||[]).map((x,j)=>`<button class="sq ${x.r<0?'bl':x.r===x.k?'ok':'no'}" onclick="det(${i},${j})">${j+1}${chute(x)?'⚡':''}</button>`).join('')}</div><div class="mut" id="dt${i}">Toque num número para ver a questão.</div></details>`).join('')+bk;scrollTo(0,0)}
function det(i,j){const x=DV[i].respostas[j],f=k=>k>=0?`${L[k]}) ${E(x.o[k])}`:'em branco';document.getElementById('dt'+i).innerHTML=`<p style="margin:8px 0 4px;color:var(--ink)"><b>${x.n}. ${E(x.q)}</b></p><p style="margin:0">Tema: ${E(x.t||x.s)} · tempo: <b>${Math.round(x.ms/1000)} s</b>${chute(x)?' ⚡':''}</p><p style="margin:0">Resposta dele: <b>${f(x.r)}</b></p><p style="margin:0">Resposta certa: <b>${f(x.k)}</b></p>`}
let S=null,PF=null,flt=null,DV=[],tab='in';
const ld=()=>{try{return JSON.parse(localStorage.getItem('sess'))}catch(e){return null}};
const sv=s=>{S=s;try{s?localStorage.setItem('sess',JSON.stringify(s)):localStorage.removeItem('sess')}catch(e){}};
async function au(path,body){const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.msg||j.error_description||j.message||r.status);return j}
const norm=j=>({access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,uid:j.user.id});
async function tok(){if(S&&Date.now()>S.exp){try{sv(norm(await au('token?grant_type=refresh_token',{refresh_token:S.refresh_token})))}catch(e){sv(null);PF=null;throw new Error('sessão expirada')}}}
async function prof(){await tok();const r=await fetch(SB_URL+'/rest/v1/profiles?select=*&id=eq.'+S.uid,{headers:H()});if(!r.ok)throw new Error(r.status);PF=(await r.json())[0];if(!PF)throw new Error('perfil')}
const v=id=>(document.getElementById(id)||{}).value||'';
function authView(msg=''){const u=tab=='up';$.innerHTML=hd()+`<h1 style="font-size:26px">${u?'Criar conta':'Entrar'}</h1><div class="card">${u?'<input id="nm" class="inp" placeholder="Nome" autocomplete="given-name"><input id="sn" class="inp" placeholder="Sobrenome" autocomplete="family-name">':''}<input id="em" class="inp" type="email" placeholder="E-mail" autocomplete="email"><input id="pw" class="inp" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="${u?'new-password':'current-password'}">${u?'<label class="mut"><input type="checkbox" id="ip" onchange="document.getElementById(\'cv\').style.display=this.checked?\'block\':\'none\'"> Sou professor(a)</label><input id="cv" class="inp" style="display:none;margin-top:8px" placeholder="Código de convite">':''}${msg?`<div class="warn">${msg}</div>`:''}<button class="btn p" style="width:100%" onclick="${u?'doUp()':'doIn()'}">${u?'Criar conta':'Entrar'}</button></div><button class="btn" style="width:100%" onclick="tab='${u?'in':'up'}';authView()">${u?'Já tenho conta':'Criar uma conta'}</button>`}
async function enter(j){sv(norm(j));await prof();intro()}
async function doIn(){try{await enter(await au('token?grant_type=password',{email:v('em').trim(),password:v('pw')}))}catch(e){sv(null);authView('Não foi possível entrar. Confira o e-mail e a senha.')}}
async function doUp(){const cv=document.getElementById('ip')&&document.getElementById('ip').checked?v('cv').trim():'';if(!v('nm').trim()||!v('sn').trim())return authView('Preencha nome e sobrenome.');
try{const j=await au('signup',{email:v('em').trim(),password:v('pw'),data:{nome:v('nm').trim(),sobrenome:v('sn').trim(),convite:cv}});if(!j.access_token){tab='in';return authView('Conta criada. Confirme seu e-mail e depois entre.')}await enter(j)}
catch(e){authView('Não foi possível criar a conta: '+E(e.message)+(cv?' (confira também o código de convite)':''))}}
function logout(){sv(null);PF=null;authView()}
const homeBtns=()=>`<p class="mut" style="margin:0 0 10px">Olá, <b>${E(PF.nome)}</b>${PF.papel=='professor'?' · '+E(PF.registro||'')+' (professor)':''}</p><button class="btn p" style="width:100%" onclick="start()">Iniciar simulado</button><button class="btn" style="width:100%;margin-top:10px" onclick="hist()">${PF.papel=='professor'?'Painel dos alunos':'Minhas tentativas'}</button><button class="btn" style="width:100%;margin-top:10px" onclick="logout()">Sair</button>`;
function pro(){if(!PF||PF.papel!='professor')return'';const m={};HD.forEach(d=>{const k=d.user_id||d.aluno,o=m[k]=m[k]||{id:d.user_id,nome:d.aluno,n:0,a:0,t:0};o.n++;o.a+=d.acertos;o.t+=d.total});
return`<div class="card"><b>Alunos</b>${flt?BT('Ver todos','flt=null;histView()'):''}<div style="margin-top:8px">`+Object.values(m).filter(o=>o.id).sort((a,b)=>a.nome.localeCompare(b.nome)).map(o=>`<button class="btn" style="width:100%;margin-bottom:6px;text-align:left;${flt==o.id?'border-color:var(--fire)':''}" onclick="flt='${o.id}';histView()">${E(o.nome)} · ${o.n} tentativa${o.n>1?'s':''} · ${Math.round(o.a/o.t*100)}%</button>`).join('')+'</div></div>'}
async function boot(){S=ld();if(!S)return authView();try{await prof();intro()}catch(e){sv(null);authView()}}
boot();
</script></body></html>
